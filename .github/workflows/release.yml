name: Build and Release

on:
  push:                        # auto-tag + release on every push to main/b2
    branches: [main, b2]
  pull_request:                # build-only check on PRs
  release:
    types: [published]         # also fires when a release is manually published
  workflow_dispatch:

permissions:
  contents: write              # needed to create tags and releases

jobs:
  # ── Auto-tag: bump patch version on every push to main/b2 ────────────────
  auto-tag:
    name: Auto tag
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/b2')
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
      new_version: ${{ steps.tag.outputs.new_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Increments patch by default (0.0.X).
          # Include 'feat:' in commit message → minor bump.
          # Include 'BREAKING CHANGE' → major bump.
          default_bump: patch
          tag_prefix: v
          release_as: ''        # let the action decide

  # ── Build: runs on every trigger ─────────────────────────────────────────
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    needs: [auto-tag]
    if: always()               # run even when auto-tag is skipped (PR / manual)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install GoReleaser
        run: |
          curl -sL https://github.com/goreleaser/goreleaser/releases/latest/download/goreleaser_Linux_x86_64.tar.gz | tar xz -C /tmp
          sudo mv /tmp/goreleaser /usr/local/bin/

      - name: Run GoReleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            goreleaser release --clean
          else
            echo "::notice::no tag on this trigger — snapshot build, nothing published"
            goreleaser release --snapshot --clean
          fi

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usque-binaries-${{ github.sha }}
          path: |
            dist/**/usque*
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          retention-days: 30
          if-no-files-found: warn

  # ── Publish GitHub Release when a new tag was just created ───────────────
  publish-release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [auto-tag, release]
    if: needs.auto-tag.outputs.new_tag != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.auto-tag.outputs.new_tag }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: usque-binaries-${{ github.sha }}
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.auto-tag.outputs.new_tag }}
          name: usque ${{ needs.auto-tag.outputs.new_tag }}
          generate_release_notes: true
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip
            dist/**/checksums.txt
