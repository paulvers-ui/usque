name: CI

# Ran on `main` only, but this fork's default branch is `b2` -- so no push to
# b2 and no PR targeting it ever built or tested, and changes landed with zero
# validation. Matching on the default branch by name keeps this correct if the
# default ever moves again, and pull_request with no branch filter covers PRs
# into any branch.
on:
  push:
    branches:
      - main
      - b2
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify modules
        run: go mod verify

      - name: Build
        run: go build -trimpath ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4
          args: --timeout=5m
